<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MH Knowledge Curation — teaser</title>
<style>
:root { --ink:#1a2233; --paper:#faf9f6; --chip:#e8ecef; --accent:#4a6fa5; }
body { font-family: Georgia, serif; max-width: 900px; margin: 0 auto; padding: 2rem; background: var(--paper); color: var(--ink); }
h1 { font-size: 1.6rem; }
.count { color: #667; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
.facet-group { margin: .6rem 0; }
.facet-group summary { cursor: pointer; color: #345; font-weight: 600; font-size: .95rem; }
.facet-group[open] summary { margin-bottom: .4rem; }
.taggroup-h { width: 100%; font-size: .8rem; color: #667; margin: .4rem 0 0; text-transform: uppercase; letter-spacing: .04em; }
.taggroup-h:first-child { margin-top: 0; }
.groupchip { background: #dde4ea; }
.groupchip.on { background: var(--accent); color: #fff; }
.chip { background: var(--chip); border: 1px solid #ccd; border-radius: 2rem; padding: .3rem .9rem; cursor: pointer; font-size: .9rem; }
.chip .ico { opacity: .75; margin-right: .25rem; font-size: .85em; }
.chip.on { background: var(--accent); color: #fff; }
.chip small { opacity: .7; }
#randomBtn { font-size: 1.2rem; padding: .7rem 2rem; background: var(--accent); color: #fff; border: 0; border-radius: .4rem; cursor: pointer; margin: 1rem 0; }
#randomBtn:hover { filter: brightness(1.1); }
.card { border: 1px solid #ccd; border-radius: .6rem; padding: 1.2rem; margin: 1rem 0; background: #fff; }
.card h2 { margin: .2rem 0 .6rem; font-size: 1.2rem; }
.card .meta { color: #667; font-size: .85rem; margin-bottom: .6rem; }
.card .teaser { line-height: 1.5; }
.pools { color: #667; font-size: .9rem; }
footer { color: #99a; font-size: .8rem; margin-top: 2rem; }
</style>
</head>
<body>
<h1>Mental health × AI — curation teaser</h1>
<p class="count" id="poolCount"></p>
<p>Pick any combination of facets, then hit the button for a random pick from that selection.</p>

<div id="facets">
<h3>Category</h3><div class="chips" id="chips-category"></div>
<h3>Type</h3><div class="chips" id="chips-type"></div>
<details class="facet-group" id="otherTagsWrap">
<summary>Other tags <small id="otherCount"></small></summary>
<div class="chips" id="chips-groupbar"></div>   <!-- one line: group selectors only -->
<div id="groupPanels"></div>                     <!-- selected group's chips appear here -->
</details>
</div>

<div id="moreWrap" style="margin:1rem 0"><button id="revealBtn">alright, a few more…</button>
<button id="reshuffleBtn" style="margin-left:.5rem">🎲 shuffle</button></div>
<div id="cards"></div>
<footer>Static teaser prototype — items link into the curated repository. No tracking, no backend. <span id="lastUpdated"></span> · <a href="https://github.com/Mentrics-inc/ai-mh-guide/issues/new?template=feedback.yml&labels=feedback" target="_blank" rel="noopener">Leave feedback ↗</a></footer>

<script>
let ITEMS = [], FACETS = {};
const active = new Set();
const revealed = [];

async function load() {
  ITEMS = await (await fetch('data/items.json')).json();
  FACETS = await (await fetch('data/facets.json')).json();
  try { const m = await (await fetch('data/meta.json')).json();
        document.getElementById('lastUpdated').textContent = '· last updated ' + m.built; } catch(e) {}
  // Other tags accordion: ONE line of group selector chips (📅 Year · 🔖 Channel ·
  // 🏛 Orgs · 👤 People · 📍 Places · 📅 Events); clicking a group reveals ONLY
  // that group's chips underneath (conserve view space — operator)
  renderChips('category'); renderChips('type');
  const bar = document.getElementById('chips-groupbar');
  const panels = document.getElementById('groupPanels');
  const GROUPS = [
    ['yr', '📅 Year'], ['ch', '🔖 Channel'], ['org', '🏛 Organizations'],
    ['person', '👤 People'], ['place', '📍 Places'], ['event', '📅 Events']
  ];
  // split FACETS.tag into ch: and yr: buckets
  const tagEntries = Object.entries(FACETS.tag || {});
  const buckets = {
    yr: tagEntries.filter(([k]) => k.startsWith('yr:')).sort((a,b)=>b[1]-a[1]),
    ch: tagEntries.filter(([k]) => k.startsWith('ch:')).sort((a,b)=>b[1]-a[1]),
    org: Object.entries(FACETS.org||{}).sort((a,b)=>b[1]-a[1]),
    person: Object.entries(FACETS.person||{}).sort((a,b)=>b[1]-a[1]),
    place: Object.entries(FACETS.place||{}).sort((a,b)=>b[1]-a[1]),
    event: Object.entries(FACETS.event||{}).sort((a,b)=>b[1]-a[1])
  };
  const total = Object.values(buckets).reduce((s,e)=>s+e.length, 0);
  document.getElementById('otherCount').textContent = `(${total} tags)`;
  GROUPS.forEach(([g, label]) => {
    if (!buckets[g].length) return;
    const sel = document.createElement('span');
    sel.className = 'chip groupchip';
    sel.dataset.g = g;
    sel.innerHTML = `${label} <small>${buckets[g].length}</small>`;
    sel.onclick = () => {
      // toggle: click group → show its chips alone; click again → clear panel
      const already = sel.classList.contains('on');
      bar.querySelectorAll('.groupchip.on').forEach(x => x.classList.remove('on'));
      panels.innerHTML = '';
      if (!already) {
        sel.classList.add('on');
        const row = document.createElement('div'); row.className = 'chips';
        renderChipsEntries(g, buckets[g], row);
        panels.appendChild(row);
      }
    };
    bar.appendChild(sel);
  });
  // details stays CLOSED (default) — operator: content visible without scrolling
  document.getElementById('poolCount').textContent = `${ITEMS.length} items in the collection`;
  // Editorial confidence score (made-up but deterministic): curated sources + has detail + recency
  ITEMS.forEach(it => {
    let c = 0;
    if (it.teaser && it.teaser.length > 80) c += 2;
    if (it.tags.includes('type:explainer')) c += 3;
    if (it.tags.includes('type:transcript')) c += 2;
    if (it.tags.includes('type:paper')) c += 2;
    if (it.year && +it.year >= 2025) c += 2;
    if (it.tags.some(t => t.startsWith('ch:'))) c += 1;
    it.conf = c + (it.id.length % 3);  // small jitter, stable
  });
  showPicks(3);
}
function renderChips(kind) {
  renderChipsInto(kind, document.getElementById('chips-' + kind));
}
function renderChipsInto(kind, host) {
  if (!host) return;
  const ICON = {org:'🏛', person:'👤', place:'📍', event:'📅', category:'🗂', type:'🏷', year:'📅', tag:'🔖'};
  const entries = Object.entries(FACETS[kind] || {}).sort((a,b)=>b[1]-a[1]).slice(0, kind==='tag'?22:99);
  renderChipsEntries(kind, entries, host, ICON[kind] || '');
}
function renderChipsEntries(kind, entries, host, ico = '') {
  if (!host) return;
  host.insertAdjacentHTML('beforeend', entries.map(([val, n]) =>
    `<span class="chip" data-k="${kind}" data-v="${val}"><span class="ico">${ico}</span>${val.replace(/^(cat:|ch:|yr:|type:)/,'')} <small>${n}</small></span>`).join(''));
  host.querySelectorAll('.chip').forEach(c => c.onclick = (ev) => {
    if (ev.ctrlKey || ev.metaKey) {           // Ctrl/Cmd+click = toggle multi-select
      if (active.has(c.dataset.k + ':' + c.dataset.v)) active.delete(c.dataset.k + ':' + c.dataset.v);
      else active.add(c.dataset.k + ':' + c.dataset.v);
      c.classList.toggle('on', active.has(c.dataset.k + ':' + c.dataset.v));
    } else {                                  // plain click = exclusive
      active.clear();
      document.querySelectorAll('.chip.on').forEach(x => x.classList.remove('on'));
      active.add(c.dataset.k + ':' + c.dataset.v);
      c.classList.add('on');
    }
    document.getElementById('cards').innerHTML = '';
    document.getElementById('poolCount').textContent = `${pool().length} items match · ${ITEMS.length} total`;
    pending = pool();                   // selection => show actual items
    document.getElementById('cards').innerHTML = '';
    reveal(12);
  });
}
function pool() {
  if (!active.size) return ITEMS;
  const out = []; const seen = new Set();
  active.forEach(a => {   // OR across selections (operator: few samples)
    const [k, ...rest] = a.split(':'); const val = rest.join(':');
    const namespaced = k + ':' + val;   // entity tags are stored as 'org:X' etc.
    ITEMS.forEach(it => {
      if (seen.has(it.id)) return;
      const hit = it[k] === val                                   // plain fields (category/type/year)
        || (it.tags && (it.tags.includes(namespaced)              // entity tags: 'event:Webinar'
                       || it.tags.includes(val)));                // legacy bare tags: 'ch:X', 'yr:2025'
      if (hit) { out.push(it); seen.add(it.id); }
    });
  });
  return out;
}
function cardHtml(it) {
  // results: clean text — entity names as plain single line, no emoji (emoji live on chips only)
  const ent = it.tags.filter(t => /^(org|person|place|event):/.test(t))
    .map(t => { const [ns,...r] = t.split(':'); return r.join(':'); }).slice(0, 6)
    .join(' · ');
  const link = it.url ? ` · <a href="${it.url}" target="_blank" rel="noopener">source ↗</a>` : '';
  const meta = [it.year || '', it.category, it.type].filter(Boolean).join(' · ');
  // "chat about this" deep-links. Prompt guarantees the chat can work even
  // when the material isn't publicly reachable: best case = title + source URL
  // (chat can open it); worst case = excerpt of the actual text inline.
  // pass the full peek (1200 chars of the actual material) — chat gets real
  // content to work with, reachable-source or not
  const peek = (it.peek || it.teaser || '').slice(0, 1200);
  const prompt = encodeURIComponent(
    `Explain this to a non-expert, with context and caveats.` +
    ` Title: "${it.title}"` +
    (it.url ? ` Source (readable online): ${it.url}` : ' Source: not publicly available.') +
    (peek ? ` Peek at the material (verify and expand with your own knowledge and sources): "${peek}"` : ''));
  const chat = `<span class="chatrow"> · 💬 <a href="https://chatgpt.com/?q=${prompt}" target="_blank" rel="noopener">ChatGPT</a>` +
    ` · <a href="https://www.perplexity.ai/search?q=${prompt}" target="_blank" rel="noopener">Perplexity</a></span>`;
  return `<div class="card" data-id="${it.id}">
    <div class="meta">${meta}${link}${chat}</div>
    <h2>${it.title}</h2>
    <p class="teaser">${it.teaser || ''}</p>
    ${ent ? `<small>${ent}</small>` : ''}
    <div class="detail" id="d-${it.id}" style="margin-top:.7rem;color:#445"></div>
  </div>`;
}
function attachDetail(it) {
  fetch('data/details/' + it.id + '.txt').then(r => r.ok ? r.text() : Promise.reject())
    .then(d => {
      const el = document.getElementById('d-' + it.id);
      if (el) el.innerHTML = '<details><summary>peek inside</summary><pre style="white-space:pre-wrap;font-size:.82rem">' + d.slice(0, 1200) + '</pre></details>';
    }).catch(() => {});
}
// Editorial top picks (confidence desc, small shuffle among top 12)
function topPicks(n) {
  return [...ITEMS].sort((a,b) => b.conf - a.conf).slice(0, 12)
    .sort(() => Math.random() - .5).slice(0, n);
}
// Random picks
function randPicks(n) {
  const p = [...pool()]; const out = [];
  while (out.length < Math.min(n, p.length)) out.push(p.splice(Math.floor(Math.random()*p.length), 1)[0]);
  return out;
}
// Throttled reveal: 3 cards at a time, 1.2s pause = the tease
// Staged reveal: batch appears one card at a time with a short pause (the tease)
let pending = [];
function reveal(n = 3) {
  const batch = pending.splice(0, n);
  batch.forEach((it, i) => {
    setTimeout(() => {
      const div = document.createElement('div'); div.innerHTML = cardHtml(it);
      document.getElementById('cards').appendChild(div.firstElementChild);
      attachDetail(it);
    }, 250 * batch.indexOf(it) + Math.floor(Math.random() * 400)); // staggered 0.25s+ up to 0.65s per card
  });
  const more = document.getElementById('moreWrap');
  if (pending.length) {
    more.style.display = 'block';
  } else if (!document.getElementById('cards').children.length) {
    document.getElementById('poolCount').textContent += ' — nothing matches that selection (try Ctrl+click to combine)';
    more.style.display = 'none';
  } else {
    // pool empty but cards exist: hide briefly? no — keep the tease going only
    // when a NEW random draw is possible (unfiltered pool). In filtered mode, stop.
    more.style.display = active.size ? 'none' : 'block';
  }
}
function showPicks(n = 9) {
  pending = topPicks(9);   // editorial mode: top-confidence mix
  document.getElementById('cards').innerHTML = '';
  pending.splice(0, 3).forEach((it) => {
    const div = document.createElement('div'); div.innerHTML = cardHtml(it);
    document.getElementById('cards').appendChild(div.firstElementChild);
    attachDetail(it);
  });
  const more = document.getElementById('moreWrap');
  more.style.display = 'block';
  document.getElementById('revealBtn').textContent = 'alright, a few more…';
}
// "a few more": reveal next batch; if pool exhausted, draw a FRESH random set
// (never disappears — the tease continues)
document.getElementById('revealBtn').onclick = () => {
  if (!pending.length) pending = randPicks(9);   // fresh draw, endless flow
  reveal(3);
};
// facet click switches to random-from-pool flow: rebuild pending lazily via reveal()
document.getElementById('reshuffleBtn').onclick = () => {
  pending = pool();
  document.getElementById('cards').innerHTML = '';
  reveal(3);
};
load();
</script>
</body>
</html>
